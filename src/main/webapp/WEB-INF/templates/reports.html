<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reports')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('reports')}"></aside>

    <main class="main">
        <div class="page-head">
            <div>
                <h1>Reports</h1>
                <p th:text="${currentUser.role.name() == 'FINANCE'} ? 'Every claim in the company, with totals for each status.'
                        : 'Claims from your team, with totals for each status.'">Claims with totals for each status.</p>
            </div>
            <div class="toolbar">
                <form method="get" th:action="@{/reports}">
                    <label for="sort">Sort by</label>
                    <select id="sort" name="sort">
                        <option th:each="s : ${sorts}" th:value="${s.name()}" th:text="${s}"
                                th:selected="${s == sort}">Newest first</option>
                    </select>
                    <button type="submit" class="button quiet">Apply</button>
                </form>
                <a class="button" th:href="@{/reports/download(sort=${sort.name()})}">
                    <svg class="icon"><use href="#i-download"/></svg>Download summary</a>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: messages}"></div>

        <th:block th:if="${counts}">
            <section th:replace="~{fragments/layout :: summary(${counts}, ${totals})}"></section>

            <section class="panel" th:with="all=${#aggregates.sum(totals.values())}">
                <div class="panel-head">
                    <h2>Amount by status</h2>
                    <span class="count" th:text="'₹' + ${#numbers.formatDecimal(all, 1, 'COMMA', 2, 'POINT')} + ' in all'">₹0.00 in all</span>
                </div>
                <div class="panel-body bars">
                    <div class="bar-row" th:each="entry : ${totals}">
                        <span th:switch="${entry.key.name()}">
                            <th:block th:case="'SUBMITTED'">Waiting</th:block>
                            <th:block th:case="'APPROVED'">Approved, not paid</th:block>
                            <th:block th:case="'REJECTED'">Rejected</th:block>
                            <th:block th:case="'REIMBURSED'">Paid</th:block>
                        </span>
                        <span class="bar-track">
                            <span class="bar-fill" th:classappend="${entry.key}"
                                  th:style="'width: ' + ${percents.get(entry.key)} + '%'"></span>
                        </span>
                        <span class="money" th:text="'₹' + ${#numbers.formatDecimal(entry.value, 1, 'COMMA', 2, 'POINT')}">₹0.00</span>
                    </div>
                </div>
            </section>
        </th:block>

        <section class="panel">
            <div class="panel-head">
                <h2 th:text="${sort}">Newest first</h2>
                <span class="count" th:text="${#lists.size(claims)} + (${#lists.size(claims) == 1} ? ' claim' : ' claims')">0 claims</span>
            </div>

            <div th:if="${#lists.isEmpty(claims)}" class="empty">
                <svg class="icon"><use href="#i-inbox"/></svg>
                <strong>No claims to report</strong>
                Claims show up here once they are submitted.
            </div>

            <div th:unless="${#lists.isEmpty(claims)}" class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th:block th:replace="~{fragments/claims :: headCells}"></th:block>
                        <th>Progress</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="claim : ${claims}">
                        <th:block th:replace="~{fragments/claims :: cells(${claim}, ${proofs != null ? proofs.get(claim.id) : null})}"></th:block>
                        <td><span th:replace="~{fragments/layout :: track(${claim.status}, ${withFinance.contains(claim.id)})}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
