<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student signup')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<div class="login">
    <section class="login-story">
        <div>
            <div class="brand-block">
                <img class="company-logo" th:src="@{${universityLogo}}" alt="" width="40" height="40">
                <span class="company-name" th:text="${universityName}">Thapar University</span>
            </div>
            <h1>Student reimbursement</h1>
            <p class="lead">Verify your university email to create an account and submit expense claims.</p>
        </div>
    </section>
    <main class="login-form">
        <div class="box">
            <h2>Create a student account</h2>
            <p th:unless="${signupAvailable}">Email registration is currently unavailable.</p>
            <div th:replace="~{fragments/layout :: messages}"></div>

            <form th:if="${signupAvailable and email != null}" method="post" th:action="@{/signup}">
                <input type="hidden" name="token" th:value="${token}">
                <p th:text="|Verifying ${email}|">Verifying your email</p>
                <div class="field">
                    <label for="code">Email code</label>
                    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                           pattern="[0-9]{6}" maxlength="6" required>
                </div>
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" name="name" autocomplete="name" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="password">Password (at least 12 characters)</label>
                    <input id="password" name="password" type="password" autocomplete="new-password"
                           minlength="12" maxlength="128" required>
                </div>
                <button class="button full" name="action" value="verify">Verify and create account</button>
            </form>

            <form class="signup-send" th:if="${signupAvailable}" method="post" th:action="@{/signup}">
                <input type="hidden" name="token" th:value="${token}">
                <div class="field">
                    <label for="email">Thapar email</label>
                    <input id="email" name="email" type="email" autocomplete="email" maxlength="100"
                           th:value="${email}" placeholder="you@thapar.edu" required>
                </div>
                <button class="button full" name="action" value="send"
                        th:text="${email == null} ? 'Send email code' : 'Request another code'">Send email code</button>
            </form>
            <p><a th:href="@{/login}">Back to sign in</a></p>
        </div>
    </main>
</div>
</body>
</html>
